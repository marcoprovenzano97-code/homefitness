<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HomeFitness">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>HomeFitness</title>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --page:#f9f9f7; --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --grid:#e1e0d9; --border:rgba(11,11,11,0.10);
  --accent:#2a78d6; --good:#1baf7a; --bad:#e34948; --warn:#eda100;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --surface-1:#1a1a19; --page:#0d0d0d; --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --border:rgba(255,255,255,0.10);
    --accent:#3987e5; --good:#199e70; --bad:#e66767; --warn:#c98500;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --page:#0d0d0d; --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
  --grid:#2c2c2a; --border:rgba(255,255,255,0.10);
  --accent:#3987e5; --good:#199e70; --bad:#e66767; --warn:#c98500;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--page);color:var(--text-primary);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom));}
h1,h2,h3{font-weight:600;margin:0;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 24px;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--page);z-index:50;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .logo{width:34px;height:34px;border-radius:9px;display:block;
  align-items:center;justify-content:center;font-size:19px;}
.brand h1{font-size:17px;}
.brand .sub{color:var(--text-secondary);font-size:12px;}
.iconbtn{border:1px solid var(--border);background:var(--surface-1);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;}

/* navigazione in basso */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface-1);border-top:1px solid var(--border);
  display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom);}
.tabbar button{flex:1;border:none;background:none;padding:9px 0 10px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--text-muted);}
.tabbar button .ic{font-size:20px;line-height:1;}
.tabbar button.on{color:var(--accent);}
.view{display:none;}
.view.on{display:block;}

/* calendario (stile Lumezzane) */
.cal-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 12px;}
.cal-nav button{border:1px solid var(--border);background:var(--surface-1);border-radius:8px;padding:6px 13px;
  cursor:pointer;font-size:15px;font-weight:600;}
.cal-nav .month-label{font-size:17px;font-weight:700;min-width:150px;text-align:center;text-transform:capitalize;}
.cal-nav .today-btn{font-size:12px;color:var(--accent);background:none;border:none;padding:4px 6px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-weekday{text-align:center;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--text-muted);padding:4px 0;}
.cal-day{background:var(--surface-1);border:1px solid var(--border);border-radius:9px;min-height:62px;padding:5px;
  display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative;overflow:hidden;}
.cal-day.other-month{opacity:.38;}
.cal-day.has{background:color-mix(in srgb, var(--accent) 9%, var(--surface-1));}
.cal-day.sel{outline:2px solid var(--accent);outline-offset:-1px;}
.daynum{font-size:12px;font-weight:700;color:var(--text-secondary);}
.cal-day.today .daynum span{color:#fff;background:var(--accent);border-radius:999px;width:21px;height:21px;
  display:inline-flex;align-items:center;justify-content:center;}
.chips{display:flex;flex-wrap:wrap;gap:2px;}
.chip{font-size:9.5px;font-weight:700;color:#fff;border-radius:4px;padding:1px 3px;line-height:1.2;max-width:100%;
  overflow:hidden;white-space:nowrap;}
.chip.more{background:var(--text-muted);}
@media (min-width:600px){ .cal-day{min-height:88px;padding:7px;} .chip{font-size:10.5px;padding:1px 5px;} }

/* calendario: intestazione */
.cal-head{margin-bottom:10px;}
.cal-head .cal-nav{margin:4px 0 10px;}
.cal-head .today-btn{margin-left:2px;}
/* PC: mese a tutta pagina */
body.desk .wrap{max-width:none;padding:12px 24px 24px;}
body.desk #v-cli, body.desk #v-conto{max-width:900px;margin:0 auto;}
body.desk #v-schede{max-width:1200px;margin:0 auto;}
body.desk #v-home{max-width:1100px;margin:0 auto;}
body.desk .cal-head{display:flex;align-items:center;justify-content:space-between;gap:16px;}
body.desk .cal-head .cal-nav{margin:0;justify-content:flex-start;}
body.desk .cal-head .month-sum{margin:0;min-width:420px;}
.cal-grid.mese{grid-template-rows:auto repeat(var(--righe,5), minmax(104px, 1fr));height:calc(100vh - 190px);min-height:620px;gap:6px;}
.cal-grid.mese .cal-weekday{font-size:11.5px;}
.cal-grid.mese .cal-day{min-height:0;padding:6px 7px;overflow:hidden;transition:border-color .15s;}
.cal-grid.mese .cal-day:hover{border-color:var(--accent);}
.cal-grid.mese .daynum{font-size:13px;}
.evs{display:flex;flex-direction:column;gap:3px;overflow-y:auto;min-height:0;}
.ev{border:none;text-align:left;cursor:pointer;font-size:12px;line-height:1.3;padding:3px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:color-mix(in srgb, var(--c) 15%, var(--surface-1));border-left:3px solid var(--c);color:var(--text-primary);}
.ev:hover{background:color-mix(in srgb, var(--c) 26%, var(--surface-1));}
.ev i{font-style:normal;color:var(--text-muted);font-size:11px;}
/* telefono: settimana */
.cal-grid.settimana{display:flex;flex-direction:column;gap:7px;}
.wday{display:grid;grid-template-columns:46px 1fr 38px;gap:10px;align-items:center;background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:8px 10px;min-height:58px;}
.wday.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
.wnum{text-align:center;line-height:1.1;}
.wnum span{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);}
.wnum b{font-size:21px;}
.wday.today .wnum b{color:var(--accent);}
.wlist{display:flex;flex-direction:column;gap:6px;min-width:0;}
.wev{border:none;text-align:left;cursor:pointer;border-radius:8px;padding:7px 10px;background:color-mix(in srgb, var(--c) 13%, var(--surface-1));border-left:4px solid var(--c);color:var(--text-primary);}
.wev .wt{display:block;font-weight:650;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wev .ws{display:block;font-size:12.5px;color:var(--text-secondary);}
.wvuoto{color:var(--text-muted);font-size:13px;}
.wadd{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--accent);background:none;color:var(--accent);font-size:22px;line-height:1;cursor:pointer;padding:0;}
.month-sum{display:flex;gap:8px;margin:12px 0 4px;}
.month-sum div{flex:1;background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:8px 10px;}
.month-sum b{display:block;font-size:17px;}
.month-sum span{font-size:11.5px;color:var(--text-muted);}

.section-h{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;}
.section-h h2{font-size:15px;}
#v-cal{padding-bottom:64px;}
.btn{border:none;background:var(--accent);color:#fff;border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px;}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--text-primary);}
.btn.danger{background:none;border:1px solid var(--bad);color:var(--bad);}
.btn.small{padding:6px 11px;font-size:13px;}
.btn:disabled{opacity:.5;}

.list{display:flex;flex-direction:column;gap:8px;}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:11px 13px;cursor:pointer;
  display:flex;gap:11px;align-items:flex-start;}
.card .bar{width:5px;align-self:stretch;border-radius:4px;flex:none;}
.card .main{flex:1;min-width:0;}
.card .t{font-weight:650;display:flex;justify-content:space-between;gap:8px;}
.card .s{font-size:12.5px;color:var(--text-secondary);}
.card .pre{font-size:12.5px;color:var(--text-muted);white-space:pre-line;max-height:3.9em;overflow:hidden;margin-top:3px;}
.nlez{font-size:11.5px;font-weight:700;color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent);
  border-radius:6px;padding:1px 7px;white-space:nowrap;}
.empty{color:var(--text-muted);font-size:13.5px;text-align:center;padding:18px 8px;background:var(--surface-1);
  border:1px dashed var(--border);border-radius:12px;}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block;}

.badge{font-size:12px;font-weight:700;border-radius:7px;padding:2px 8px;white-space:nowrap;}
.badge.pos{color:var(--good);background:color-mix(in srgb, var(--good) 13%, transparent);}
.badge.neg{color:var(--bad);background:color-mix(in srgb, var(--bad) 13%, transparent);}
.badge.zero{color:var(--text-muted);background:color-mix(in srgb, var(--text-muted) 14%, transparent);}

/* contabilità */
.tot{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-top:6px;text-align:center;}
.tot span{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.tot b{display:block;font-size:34px;line-height:1.15;margin:2px 0 4px;}
.tot b.neg{color:var(--bad);} .tot b.pos{color:var(--good);}
.tot em{font-style:normal;font-size:13px;color:var(--text-secondary);}
.card.conto .main{display:flex;flex-direction:column;gap:6px;}
.calc{font-size:13.5px;color:var(--text-secondary);}
.calc div{display:grid;grid-template-columns:1fr auto 80px;gap:8px;padding:2px 0;}
.calc div b{font-weight:600;color:var(--text-primary);text-align:right;}
.calc div:last-child{border-bottom:1px solid var(--grid);padding-bottom:6px;}
.esito{font-size:15px;font-weight:600;}
.esito b{font-size:17px;}
.esito small{font-size:12px;font-weight:500;color:var(--text-muted);}
.esito.neg{color:var(--bad);} .esito.pos{color:var(--good);} .esito.zero{color:var(--text-muted);}
.card.conto .btn{align-self:flex-start;}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:10px 12px;}
.kpi span{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;font-weight:650;}
.kpi b{display:block;font-size:21px;margin-top:2px;}
.kpi b.pos{color:var(--good);} .kpi b.neg{color:var(--bad);}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;}
.seg button{border:none;background:var(--surface-1);padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-secondary);}
.seg button.on{background:var(--accent);color:#fff;}
table.tab{width:100%;border-collapse:collapse;background:var(--surface-1);border:1px solid var(--border);border-radius:12px;overflow:hidden;font-size:13.5px;}
.tab th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);text-align:right;padding:8px 8px;font-weight:700;border-bottom:1px solid var(--border);}
.tab td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--grid);}
.tab tr:last-child td{border-bottom:none;}
.tab th:first-child,.tab td:first-child{text-align:left;}
.tab tr.click{cursor:pointer;}
.tab tfoot td{font-weight:700;border-top:1px solid var(--border);}

/* fogli (modali dal basso) */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.sheet{background:var(--surface-1);border-radius:16px 16px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));
  width:100%;max-width:560px;max-height:92vh;overflow-y:auto;position:relative;box-shadow:0 -8px 40px rgba(0,0,0,.3);}
@media (min-width:600px){ .overlay{align-items:center;} .sheet{border-radius:16px;} }
.sheet h3{font-size:17px;margin-bottom:12px;padding-right:30px;}
.x{position:absolute;top:10px;right:12px;background:none;border:none;font-size:24px;line-height:1;color:var(--text-muted);cursor:pointer;padding:4px 8px;}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.f label{font-size:12px;font-weight:700;color:var(--text-secondary);display:flex;justify-content:space-between;align-items:center;}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;background:var(--page);font-size:16px;}
.f textarea{resize:vertical;min-height:110px;line-height:1.4;}
.row2{display:flex;gap:10px;} .row2>.f{flex:1;min-width:0;}
.hint{font-size:11.5px;color:var(--text-muted);font-weight:500;}
.linkbtn{border:none;background:none;color:var(--accent);font-size:12.5px;font-weight:650;cursor:pointer;padding:0;}
.pick{display:flex;flex-wrap:wrap;gap:6px;}
.pick button{border:1.5px solid var(--border);background:var(--page);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;}
.pick button.on{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, var(--page));}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;}
.swatch.on{border-color:var(--text-primary);}
.actions{display:flex;gap:8px;margin-top:6px;}
.actions .btn{flex:1;padding:11px;}
.nbig{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent);
  border-radius:8px;padding:4px 10px;margin-bottom:12px;}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.file{position:relative;width:86px;height:86px;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--page);
  display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:10.5px;color:var(--text-secondary);text-align:center;text-decoration:none;}
.file img{width:100%;height:100%;object-fit:cover;}
.file .ic{font-size:26px;}
.file .rm{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:13px;cursor:pointer;line-height:22px;padding:0;}
.file.add{border-style:dashed;cursor:pointer;color:var(--accent);font-weight:650;}
.file .nm{padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.stats div{background:var(--page);border-radius:10px;padding:8px;text-align:center;}
.stats b{display:block;font-size:17px;}
.stats span{font-size:11px;color:var(--text-muted);}
.hist{border-top:1px solid var(--border);padding-top:10px;margin-top:6px;}
.hist h4{margin:6px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-secondary);}
.hrow{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--grid);cursor:pointer;font-size:13.5px;}
.hrow:last-child{border-bottom:none;}
.hrow .pre{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
.scheda-view{white-space:pre-wrap;background:var(--page);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px;}

.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:none;
  background:var(--accent);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;z-index:55;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--text-primary);color:var(--page);
  padding:9px 16px;border-radius:10px;font-size:13.5px;z-index:400;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;}
.toast.on{opacity:1;}
.toast.err{background:var(--bad);color:#fff;}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb, var(--page) 70%, transparent);z-index:500;}
.loading div{width:34px;height:34px;border:3px solid var(--grid);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
/* home: resoconto atleta */
.dh-top{display:flex;align-items:center;gap:10px;margin:6px 0 14px;}
.dh-lab{font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;}
.dh-sel{flex:1;max-width:420px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface-1);font-size:16px;font-weight:600;}
.dh-head{display:flex;gap:12px;align-items:center;margin-bottom:12px;}
.dh-head h2{font-size:21px;}
.dh-head a{color:var(--accent);}
.dh-dot{width:14px;height:44px;border-radius:7px;flex:none;}
.dh-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
@media (max-width:700px){ .dh-kpi{grid-template-columns:repeat(2,minmax(0,1fr));} }
.dh-kpi .kpi b{font-size:20px;}
.dh-kpi .kpi em{display:block;font-style:normal;font-size:12px;color:var(--text-muted);margin-top:1px;}
.dh-kpi .kpi b.neg{color:var(--bad);} .dh-kpi .kpi b.pos{color:var(--good);}
.dh-kpi .kpi > span:last-child:not(:first-child){display:block;font-size:12px;color:var(--text-muted);text-transform:none;letter-spacing:0;font-weight:500;}
.dh-azioni{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px;}
.dh-azioni .btn{flex:1 1 auto;}
.dh-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px;}
@media (min-width:900px){ .dh-grid{grid-template-columns:1fr 1fr;} .dh-largo{grid-column:1/-1;} }
.dh-box{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:12px 14px;min-width:0;}
.dh-box h3{font-size:14.5px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.dh-chart{position:relative;}
.dh-chart svg{width:100%;height:auto;display:block;}
.dh-chart .gl{stroke:var(--grid);stroke-width:1;}
.dh-chart .gl.base{stroke:var(--text-muted);}
.dh-chart .ax{fill:var(--text-muted);font-size:11px;}
.dh-chart .bar{fill:var(--accent);}
.dh-chart .hit{fill:transparent;cursor:pointer;}
.dh-chart .hit.sel{fill:color-mix(in srgb, var(--accent) 8%, transparent);}
.dh-tip{position:absolute;top:0;width:110px;background:var(--text-primary);color:var(--page);border-radius:8px;padding:6px 9px;font-size:12.5px;line-height:1.3;
  pointer-events:none;opacity:0;transition:opacity .12s;text-align:center;}
.dh-tip.on{opacity:1;}
.dh-tip b{font-size:15px;} .dh-tip span{opacity:.8;}
.dh-riga{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;padding:8px 0;border-bottom:1px solid var(--grid);cursor:pointer;font-size:14px;color:var(--text-primary);}
.dh-riga:last-child{border-bottom:none;}
.dh-riga.statica{cursor:default;}
.dh-riga small{display:block;font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px;}
.dh-riga .pos{color:var(--good);font-weight:600;}
.dh-pross{font-style:normal;font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 4px;}
.dh-sez{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px;}
.dh-sez div{background:var(--page);border-radius:9px;padding:7px 9px;font-size:12px;color:var(--text-secondary);}
.dh-sez b{display:block;font-size:16px;color:var(--text-primary);}
.dh-sez i{display:block;height:4px;border-radius:2px;margin-top:5px;background:linear-gradient(90deg, var(--accent) var(--p), var(--grid) var(--p));}
.dh-es{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13.5px;}
.dh-es span:nth-child(2){flex:1;min-width:0;}
.dh-es .sv-img{width:54px;height:36px;}
.dh-conto{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;}
.dh-conto div{background:var(--page);border-radius:9px;padding:7px 10px;font-size:12px;color:var(--text-secondary);}
.dh-conto b{display:block;font-size:16px;color:var(--text-primary);}

/* schede e glossario */
.seg-full{display:flex;width:100%;}
.seg-full button{flex:1;padding:9px 6px;}
.sheet.wide{max-width:880px;}
#ov2{z-index:320;}
.cerca{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 12px;background:var(--surface-1);font-size:16px;margin:10px 0 8px;}
.chips-cat{margin-bottom:6px;}
.chips-cat button{padding:5px 11px;font-size:13px;}
.es-gruppo{margin:16px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-secondary);}
.es-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
@media (max-width:420px){ .es-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
.es-card{position:relative;border:1.5px solid var(--border);background:var(--surface-1);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;}
.es-card.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;}
.es-img{display:block;aspect-ratio:3/2;background:#fff;overflow:hidden;}
.es-img img{width:100%;height:100%;object-fit:cover;display:block;}
.es-ico{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:var(--accent);background:color-mix(in srgb, var(--accent) 8%, var(--surface-1));}
.es-ico svg{width:46%;height:auto;max-height:80%;}
.es-nome{display:block;padding:7px 9px 9px;font-size:13px;font-weight:600;line-height:1.25;}
.es-nome em{font-style:normal;font-size:10.5px;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 4px;margin-left:2px;}
.es-check{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:14px;display:none;align-items:center;justify-content:center;}
.es-card.on .es-check{display:flex;}
.es-foto{display:grid;gap:6px;margin-bottom:12px;border-radius:12px;overflow:hidden;}
.es-foto.due{grid-template-columns:1fr 1fr;}
.es-foto img{width:100%;display:block;border-radius:10px;background:#fff;}
.es-foto.vuota{display:flex;align-items:center;gap:12px;padding:10px;background:var(--page);font-size:13px;color:var(--text-muted);}
.es-foto.vuota .es-ico{width:80px;height:60px;border-radius:8px;flex:none;}
.sc-card .minis{display:flex;gap:4px;margin-top:6px;align-items:center;}
.sc-pdf{margin-left:auto;}
.mini{width:44px;height:30px;border-radius:5px;overflow:hidden;background:#fff;display:block;}
.mini img{width:100%;height:100%;object-fit:cover;}
.mini .es-ico svg{width:60%;}
.kb{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:12px;background:var(--page);}
.kb-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;}
.kb-h h4{margin:0;font-size:15px;}
.kb-vuoto{font-size:13px;color:var(--text-muted);padding:6px 0;}
.kit{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--grid);}
.kit-img{width:64px;height:44px;flex:none;border-radius:7px;overflow:hidden;background:#fff;cursor:pointer;}
.kit-img img{width:100%;height:100%;object-fit:cover;}
.kit-main{flex:1;min-width:0;}
.kit-nome{display:flex;justify-content:space-between;gap:6px;align-items:flex-start;font-size:14px;}
.kit-az{display:flex;gap:4px;flex:none;}
.kit-az button{width:30px;height:28px;border:1px solid var(--border);background:var(--surface-1);border-radius:7px;cursor:pointer;font-size:13px;padding:0;}
.kit-az button:disabled{opacity:.35;}
.kit-campi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px;}
@media (max-width:520px){ .kit-campi{grid-template-columns:repeat(2,minmax(0,1fr));} }
.kit-campi label{font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.02em;display:flex;flex-direction:column;gap:2px;}
.kit-campi input,.kit-note{width:100%;border:1px solid var(--border);border-radius:7px;padding:6px 8px;background:var(--surface-1);font-size:15px;}
.kit-note{margin-top:6px;font-size:14px;}
.pk-grid{max-height:58vh;overflow-y:auto;margin:0 -4px;padding:0 4px;}
.pk-azioni{position:sticky;bottom:-20px;background:var(--surface-1);padding:10px 0 4px;}
.sv-blocco{margin-bottom:14px;}
.sv-blocco h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);}
.sv-it{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--grid);font-size:14px;}
.sv-img{width:72px;height:48px;flex:none;border-radius:7px;overflow:hidden;background:#fff;}
.sv-img img{width:100%;height:100%;object-fit:cover;}
.sv-dati{color:var(--text-secondary);font-size:13px;}
.wrapbtn{flex-wrap:wrap;}
.wrapbtn .btn{flex:1 1 40%;}
#stampa{display:none;}
@media print {
  body{background:#fff;padding:0;}
  body > *:not(#stampa){display:none !important;}
  #stampa{display:block !important;color:#000;font:12px/1.35 system-ui,sans-serif;}
  #stampa .st-head{display:flex;gap:12px;align-items:center;border-bottom:2px solid #2a78d6;padding-bottom:8px;margin-bottom:12px;}
  #stampa .st-head img{width:40px;height:40px;}
  #stampa h1{font-size:20px;margin:0;} #stampa .st-head p{margin:2px 0 0;color:#555;}
  #stampa .sv-blocco{break-inside:auto;margin-bottom:10px;}
  #stampa .sv-blocco h4{color:#2a78d6;font-size:12px;margin:8px 0 4px;break-after:avoid;}
  #stampa .sv-it{break-inside:avoid;border-bottom:1px solid #ddd;padding:5px 0;}
  #stampa .sv-img{width:84px;height:56px;border:1px solid #eee;}
  #stampa .sv-dati{color:#333;} #stampa .hint{color:#666;}
  #stampa .es-ico{color:#2a78d6;background:#eef4fc;}
  @page{margin:12mm;}
}
.hidden{display:none !important;}
.authbox{max-width:400px;margin:28px auto 0;background:var(--surface-1);border:1px solid var(--border);border-radius:16px;padding:22px 20px;}
.authbox h2{font-size:20px;margin-bottom:4px;}
.authbox .hint{margin:0 0 16px;font-size:13.5px;}
.amsg{font-size:13.5px;margin:-2px 0 12px;min-height:1px;}
.amsg.err{color:var(--bad);} .amsg.ok{color:var(--good);}
.alinks{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:16px;}
.alinks .linkbtn{font-size:14px;padding:4px;}
.menu-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:var(--page);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:15px;}
textarea.incolla{width:100%;min-height:140px;border:1px solid var(--border);border-radius:9px;padding:9px 11px;background:var(--page);font:12px/1.3 ui-monospace,monospace;}
.foot{font-size:11.5px;color:var(--text-muted);text-align:center;margin-top:22px;}
.foot a{color:var(--accent);}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><img class="logo" src="icons/icon-192.png" alt=""><div><h1>HomeFitness</h1><div class="sub" id="sub">Lezioni e contabilità</div></div></div>
  <div style="display:flex;gap:6px"><button class="iconbtn" id="themeBtn" title="Tema" aria-label="Cambia tema">🌓</button>
  <button class="iconbtn hidden" id="accBtn" title="Account" aria-label="Account">👤</button></div>
</div>

<!-- ACCESSO -->
<div class="wrap hidden" id="auth">
  <div class="authbox">
    <h2 id="aTit">Accedi</h2>
    <p class="hint" id="aSub">Entra con la tua email e la tua password.</p>
    <form id="aForm" autocomplete="on">
      <div class="f"><label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="email" inputmode="email" required></div>
      <div class="f" id="aPwBox"><label for="aPw">Password</label><input id="aPw" type="password" autocomplete="current-password" minlength="8" required></div>
      <div class="f hidden" id="aPw2Box"><label for="aPw2">Ripeti la password</label><input id="aPw2" type="password" autocomplete="new-password" minlength="8"></div>
      <div class="amsg" id="aMsg" role="status" aria-live="polite"></div>
      <button class="btn" style="width:100%;padding:12px" id="aGo" type="submit">Accedi</button>
    </form>
    <div class="alinks">
      <button class="linkbtn" id="aSwitch" type="button">Prima volta? Crea l’account</button>
      <button class="linkbtn" id="aForgot" type="button">Password dimenticata?</button>
    </div>
  </div>
</div>

<div class="wrap hidden" id="main">
  <!-- HOME: resoconto dell'atleta -->
  <section class="view on" id="v-home">
    <div class="dh-top">
      <label for="dhSel" class="dh-lab">Atleta</label>
      <select id="dhSel" class="dh-sel"></select>
    </div>
    <div id="dhBody"></div>
  </section>

  <!-- CALENDARIO -->
  <section class="view" id="v-cal">
    <div class="cal-head">
      <div class="cal-nav">
        <button id="calPrev" aria-label="Precedente">‹</button>
        <div class="month-label" id="calLabel"></div>
        <button id="calNext" aria-label="Successivo">›</button>
        <button class="today-btn linkbtn" id="calToday">Oggi</button>
      </div>
      <div class="month-sum" id="monthSum"></div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </section>

  <!-- CLIENTI -->
  <section class="view" id="v-cli">
    <div class="section-h" style="margin-top:6px"><h2>Clienti</h2><button class="btn small" id="cliAdd">+ Nuovo cliente</button></div>
    <div class="list" id="cliList"></div>
    <div style="text-align:center;margin-top:12px"><button class="linkbtn" id="cliArch"></button></div>
  </section>

  <!-- SCHEDE -->
  <section class="view" id="v-schede">
    <div class="seg seg-full" id="scSeg" style="margin:6px 0 14px"><button data-t="mie" class="on">Le mie schede</button><button data-t="glo">Glossario esercizi</button></div>
    <div id="scMie">
      <div class="section-h" style="margin-top:0"><h2>Schede</h2><button class="btn small" id="scNuova">+ Nuova scheda</button></div>
      <div class="list" id="scList"></div>
    </div>
    <div id="scGlo" class="hidden">
      <div class="section-h" style="margin-top:0"><h2 id="gloSub">Glossario</h2><button class="btn small ghost" id="gloNuovo">+ Esercizio mio</button></div>
      <div id="gloFiltri"></div>
      <div id="gloGrid"></div>
      <p class="hint" style="margin-top:14px">Foto degli esercizi: <a href="https://github.com/yuhonas/free-exercise-db" target="_blank" rel="noopener">free-exercise-db</a> (pubblico dominio). Puoi sostituirle con le tue.</p>
    </div>
  </section>

  <!-- CONTABILITÀ -->
  <section class="view" id="v-conto">
    <div class="tot" id="ctTot"></div>
    <div class="section-h"><h2>Situazione clienti</h2><button class="btn small" id="pagAdd">+ Pagamento</button></div>
    <div class="list" id="ctCli"></div>
    <div class="section-h"><h2>Mese per mese</h2></div>
    <div id="ctMesi"></div>
    <div class="section-h"><h2>Ultimi pagamenti ricevuti</h2></div>
    <div class="list" id="pagList"></div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<button class="fab hidden" id="fab" title="Segna lezione" aria-label="Segna lezione">+</button>

<nav class="tabbar hidden" id="tabbar">
  <button data-v="home" class="on"><span class="ic">🏠</span>Home</button>
  <button data-v="cal"><span class="ic">📅</span>Calendario</button>
  <button data-v="cli"><span class="ic">👥</span>Clienti</button>
  <button data-v="schede"><span class="ic">📋</span>Schede</button>
  <button data-v="conto"><span class="ic">💶</span>Contabilità</button>
</nav>

<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="overlay" id="ov2"><div class="sheet" id="sheet2"></div></div>

<div class="loading" id="loading"><div></div></div>

<script src="vendor/supabase.min.js"></script>
<script src="config.js"></script>
<script src="esercizi.js"></script>
<script>
// ---------- base ----------
// ?demo nell'indirizzo = anteprima con dati di prova, senza login e senza toccare il database.
const DEMO = /[?&]demo\b/.test(location.search);
const sb = DEMO ? null : supabase.createClient(HF_CONFIG.supabaseUrl, HF_CONFIG.supabaseKey,
  { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
let UTENTE = null;
function api(fn, ...args) {
  if (DEMO) return new Promise(r => setTimeout(() => r(MOCK[fn](...args)), 250));
  return DB[fn](...args);
}
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => ('0' + n).slice(-2);
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const fmtD = s => { const p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
const eur = n => (Math.round(n * 100) / 100).toLocaleString('it-IT', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }) + ' €';
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const GIORNI = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const COLORI = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];
const METODI = ['Contanti','Bonifico','Satispay','PayPal','Altro'];
const OGGI = iso(new Date());

let S = { clienti: [], lezioni: [], pagamenti: [], tariffaDefault: 15 };
let calM = new Date(); calM.setDate(1);
let selDay = OGGI;
let showArch = false;

function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', err ? 4000 : 2000);
}
function busy(on) { $('loading').classList.toggle('hidden', !on); }
async function run(fn, args, okMsg) {
  busy(true);
  try { S = await api(fn, ...(args || [])); render(); if (okMsg) toast(okMsg); return true; }
  catch (e) { toast((e && e.message) || String(e), true); return false; }
  finally { busy(false); }
}

// tema
(function () {
  let t = null; try { t = localStorage.getItem('hf-theme'); } catch (e) {}
  if (t) document.documentElement.dataset.theme = t;
  $('themeBtn').onclick = () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const n = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = n;
    try { localStorage.setItem('hf-theme', n); } catch (e) {}
  };
})();

// ---------- calcoli ----------
const cli = id => S.clienti.find(c => c.id === id) || { nome: '?', colore: '#898781', tariffa: S.tariffaDefault, prec: 0, saldoIniz: 0 };
const ordLez = (a, b) => a.d.localeCompare(b.d) || (a.ora || '').localeCompare(b.ora || '') || (a.ins || 0) - (b.ins || 0);

/** numero progressivo di ogni lezione per cliente (lezioni già fatte prima dell'app + ordine cronologico) */
function numeri() {
  const out = {}, per = {};
  S.lezioni.slice().sort(ordLez).forEach(l => { per[l.cliente] = (per[l.cliente] || 0) + 1; out[l.id] = cli(l.cliente).prec + per[l.cliente]; });
  return out;
}
/** numero che avrebbe una nuova lezione in quella data/ora */
function numeroNuova(cid, d, ora, escludiId) {
  const prima = S.lezioni.filter(l => l.cliente === cid && l.id !== escludiId &&
    (l.d < d || (l.d === d && (l.ora || '') <= (ora || '')))).length;
  return cli(cid).prec + prima + 1;
}
/**
 * Conto del cliente. Contano tutte le lezioni: quelle fatte prima dell'app (a tariffa) + quelle segnate nel calendario.
 * pagato = pagamenti registrati + quanto aveva già pagato prima dell'app (saldoIniz).
 * saldo: negativo = ti deve dei soldi, positivo = ha pagato lezioni in anticipo.
 */
function saldo(cid) {
  const c = cli(cid), ls = S.lezioni.filter(l => l.cliente === cid);
  const dov = (c.prec || 0) * c.tariffa + ls.reduce((s, l) => s + l.importo, 0);
  const pag = (c.saldoIniz || 0) + S.pagamenti.filter(p => p.cliente === cid).reduce((s, p) => s + p.importo, 0);
  return { dov, pag, saldo: pag - dov, n: ls.length, tot: (c.prec || 0) + ls.length };
}
function badgeSaldo(v, tariffa) {
  if (Math.abs(v) < 0.005) return '<span class="badge zero">in pari</span>';
  if (v > 0) {
    const nl = tariffa ? Math.floor(v / tariffa + 1e-9) : 0;
    return '<span class="badge pos">credito ' + eur(v) + (nl ? ' · ' + nl + ' lez.' : '') + '</span>';
  }
  return '<span class="badge neg">deve ' + eur(-v) + '</span>';
}
const iniziali = n => n.trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();

// ---------- render ----------
function render() {
  renderCal(); renderCli(); renderConto(); if (typeof renderSchede === 'function') renderSchede(); if (typeof renderHome === 'function') renderHome();
  $('foot').innerHTML = DEMO ? 'Anteprima con dati di prova' : 'HomeFitness · ' + esc(UTENTE ? UTENTE.email : '');
}

// Sul PC (schermo largo) il calendario è mensile a tutta pagina; sul telefono è settimanale.
const DESK = matchMedia('(min-width: 900px)');
const lunedi = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; };
function perGiorno() { const o = {}; S.lezioni.forEach(l => (o[l.d] = o[l.d] || []).push(l)); Object.values(o).forEach(a => a.sort(ordLez)); return o; }
function spostaCal(n) {
  if (DESK.matches) calM.setMonth(calM.getMonth() + n);
  else { const d = parse(selDay); d.setDate(d.getDate() + 7 * n); selDay = iso(d); }
  renderCal();
}
function riepilogo(ls, etichetta) {
  const cl = new Set(ls.map(l => l.cliente)).size;
  $('monthSum').innerHTML = '<div><b>' + ls.length + '</b><span>lezioni ' + etichetta + '</span></div><div><b>' + cl +
    '</b><span>clienti</span></div><div><b>' + eur(ls.reduce((s, l) => s + l.importo, 0)) + '</b><span>maturato</span></div>';
}
function renderCal() {
  document.body.classList.toggle('desk', DESK.matches);
  if (DESK.matches) renderMese(); else renderSettimana();
}

function renderMese() {
  const y = calM.getFullYear(), m = calM.getMonth(), nn = numeri(), pg = perGiorno();
  $('calLabel').textContent = MESI[m] + ' ' + y;
  $('calPrev').setAttribute('aria-label', 'Mese precedente'); $('calNext').setAttribute('aria-label', 'Mese successivo');
  const first = new Date(y, m, 1), start = new Date(first);
  start.setDate(1 - ((first.getDay() + 6) % 7));
  const last = new Date(y, m + 1, 0), end = new Date(last);
  end.setDate(last.getDate() + (7 - ((last.getDay() + 6) % 7) - 1));
  const settimane = Math.round((end - start) / 864e5 + 1) / 7;
  let h = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'].map(g => '<div class="cal-weekday">' + g + '</div>').join('');
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const k = iso(d), ls = pg[k] || [];
    const cls = ['cal-day', d.getMonth() !== m ? 'other-month' : '', k === OGGI ? 'today' : '', ls.length ? 'has' : ''].join(' ');
    h += '<div class="' + cls + '" data-d="' + k + '" title="Segna una lezione il ' + fmtD(k) + '"><div class="daynum"><span>' + d.getDate() + '</span></div><div class="evs">' +
      ls.map(l => { const c = cli(l.cliente);
        return '<button class="ev" data-id="' + l.id + '" style="--c:' + esc(c.colore) + '"><b>' + esc(l.ora || '') + '</b> ' + esc(c.nome) + ' <i>n° ' + nn[l.id] + '</i></button>'; }).join('') +
      '</div></div>';
  }
  const g = $('calGrid');

function renderConto() {

  const conti = S.clienti.map(c => Object.assign({ c }, saldo(c.id)))
    .filter(r => r.c.attivo || Math.abs(r.saldo) > 0.005)

  const debitori = conti.filter(r => r.saldo < -0.005);
  const deb = debitori.reduce((s, r) => s - r.saldo, 0);
  $('ctTot').innerHTML = deb > 0.005
    ? '<span>Ti devono in totale</span><b class="neg">' + eur(deb) + '</b><em>' + debitori.map(r => esc(r.c.nome) + ' ' + eur(-r.saldo)).join(' · ') + '</em>'
    : '<span>Ti devono in totale</span><b class="pos">0 €</b><em>Tutti i clienti sono in pari 👍</em>';
  // una scheda per cliente: lezioni × tariffa − pagato = quanto deve
  $('ctCli').innerHTML = conti.length ? conti.map(r => {
    const c = r.c, v = r.saldo;
    const esito = v < -0.005 ? '<div class="esito neg">Ti deve <b>' + eur(-v) + '</b>' + (c.tariffa ? ' <small>(' + (Math.round(-v / c.tariffa * 10) / 10).toLocaleString('it-IT') + ' lezioni da pagare)</small>' : '') + '</div>'
      : v > 0.005 ? '<div class="esito pos">Ha pagato in anticipo <b>' + eur(v) + '</b>' + (c.tariffa >= 0.01 && v >= c.tariffa ? ' <small>(' + Math.floor(v / c.tariffa + 1e-9) + ' lezioni)</small>' : '') + '</div>'

    return '<div class="card" data-id="' + p.id + '"><div class="bar" style="background:' + esc(c.colore) + '"></div><div class="main"><div class="t"><span>' + esc(c.nome) +

function apri(html, cls) {
  const sh = $('sheet');

  sh.innerHTML = '<button class="x" onclick="chiudi()" aria-label="Chiudi">×</button>' + html;

/** Chiude il foglio; se c'è un controllo "uscire senza salvare?" lo chiede prima. */
function chiudi() {

}

  let apre, foto;
  if (a.dove === 'storage') {  // caricata in questa app: link firmato aggiunto da firma()
    apre = 'href="#" data-path="' + esc(a.id) + '"';
    foto = '<img alt="" data-img' + fallback + '>';
  } else {                     // caricata con la vecchia app: resta su Google Drive
    apre = 'href="https://drive.google.com/file/d/' + encodeURIComponent(a.id) + '/view"';
    foto = '<img src="https://drive.google.com/thumbnail?id=' + encodeURIComponent(a.id) + '&sz=w300" alt=""' + fallback + '>';

    $('lN').classList.toggle('hidden', !cid);
    if (cid) $('lN').textContent = 'Lezione n° ' + numeroNuova(cid, $('lD').value, $('lO').value, l.id);

  };
}

/** Legge un file: le foto vengono ridotte (max 1600 px, JPEG) per caricarle in fretta anche col telefono. */
function preparaFile(f) {
  return new Promise((res, rej) => {
    if (/^image\//.test(f.type)) {
      const url = URL.createObjectURL(f), img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1600 / Math.max(img.width, img.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        const du = cv.toDataURL('image/jpeg', 0.82);
        res({ nome: f.name.replace(/\.[^.]+$/, '') + '.jpg', tipo: 'image/jpeg', b64: du.split(',')[1], prev: du });
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Immagine non leggibile: ' + f.name)); };
      img.src = url;
    } else {
      if (f.size > 20 * 1024 * 1024) return rej(new Error('File troppo grande (max 20 MB): ' + f.name));
      const r = new FileReader();
      r.onload = () => res({ nome: f.name, tipo: f.type || 'application/pdf', b64: String(r.result).split(',')[1], prev: '' });
      r.onerror = () => rej(new Error('File non leggibile: ' + f.name));
      r.readAsDataURL(f);
    }
  });
}

function formPagamento(p, cid) {
  const nuovo = !p;
  p = p || { d: OGGI, cliente: cid || '', importo: '', metodo: 'Contanti', note: '' };
  const st = { cliente: p.cliente };
  apri('<h3>' + (nuovo ? 'Registra pagamento' : 'Modifica pagamento') + '</h3>' +
    '<div class="f"><label>Cliente</label>' + pickClienti(p.cliente, true) + '</div>' +
    '<div class="f" id="pQ"></div>' +

    '<div class="f"><label>Data</label><input type="date" id="pD" value="' + p.d + '"></div></div>' +
    '<div class="f"><label>Metodo</label><div class="pick" id="pM">' + METODI.map(m => '<button type="button" data-v="' + m + '" class="' + (m === p.metodo ? 'on' : '') + '">' + m + '</button>').join('') + '</div></div>' +

    if (!st.cliente) { $('pQ').innerHTML = ''; return; }
    const c = cli(st.cliente), s = saldo(st.cliente).saldo + (nuovo ? 0 : p.importo);
    const opts = [[1, c.tariffa], [5, c.tariffa * 5], [10, c.tariffa * 10]];
    $('pQ').innerHTML = '<label>Importo rapido <span class="hint">saldo attuale: ' + (s < -0.005 ? 'deve ' + eur(-s) : s > 0.005 ? 'credito ' + eur(s) : 'in pari') + '</span></label><div class="pick" id="pQb">' +
      (s < -0.005 ? '<button type="button" data-v="' + (-s) + '">Salda tutto · ' + eur(-s) + '</button>' : '') +

  };

    if (!confirm('Eliminare questo pagamento?')) return;

function errore(e) {
  const m = String((e && (e.message || e.error_description)) || e || '');
  if (/foreign key|23503/i.test(m + (e && e.code))) return new Error('Il cliente ha lezioni o pagamenti registrati: archivialo invece di eliminarlo');
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return new Error('Nessuna connessione: riprova quando sei online');
  if (/JWT|session/i.test(m)) return new Error('Accesso scaduto: esci e rientra');
  return new Error(m || 'Errore sconosciuto');
}
const ok = r => { if (r.error) throw errore(r.error); return r.data; };
const nuovoId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).replace(/-/g, '').slice(0, 20);

/** Legge tutte le righe di una tabella (il database ne restituisce al massimo 1000 per volta). */
async function tutte(tab) {
  let out = [], da = 0;
  for (;;) {
    const r = ok(await sb.from(tab).select('*').order('id').range(da, da + 999));
    out = out.concat(r);
    if (r.length < 1000) return out;
    da += 1000;
  }
}
const num = v => Number(v) || 0;
const daCli = r => ({ id: r.id, nome: r.nome, tel: r.tel, tariffa: num(r.tariffa) || 15, prec: r.prec || 0, saldoIniz: num(r.saldo_iniz), colore: r.colore, attivo: r.attivo, note: r.note });
const daLez = r => ({ id: r.id, d: r.d, ora: r.ora, cliente: r.cliente, importo: num(r.importo), scheda: r.scheda, scheda_id: r.scheda_id || null, allegati: r.allegati || [], note: r.note, ins: Date.parse(r.ins) || 0 });
const daSch = r => ({ id: r.id, nome: r.nome, cliente: r.cliente, note: r.note, blocchi: r.blocchi || {}, modificata: r.modificata });
const daEs = r => ({ id: r.id, base: r.base, nome: r.nome, sez: r.sez, cat: r.cat, descr: r.descr, foto: r.foto });
const daPag = r => ({ id: r.id, d: r.d, cliente: r.cliente, importo: num(r.importo), metodo: r.metodo, note: r.note });
const b64blob = (b64, tipo) => { const s = atob(b64), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return new Blob([a], { type: tipo }); };

const DB = {
  async carica() {
    const [c, l, p, sc, es] = await Promise.all([tutte('clienti'), tutte('lezioni'), tutte('pagamenti'), tutte('schede'), tutte('esercizi_miei')]);
    return { clienti: c.map(daCli), lezioni: l.map(daLez), pagamenti: p.map(daPag), schede: sc.map(daSch), esercizi: es.map(daEs), tariffaDefault: 15 };
  },
  async salvaCliente(c) {
    const nome = String(c.nome || '').trim();
    if (!nome) throw new Error('Scrivi il nome del cliente');
    const riga = { nome, tel: c.tel || '', tariffa: Number(c.tariffa) > 0 ? Number(c.tariffa) : 15, prec: Math.max(0, Math.round(Number(c.prec) || 0)),
      saldo_iniz: Number(c.saldoIniz) || 0, colore: c.colore || COLORI[S.clienti.length % COLORI.length], attivo: c.attivo !== false, note: c.note || '' };
    if (c.id) ok(await sb.from('clienti').update(riga).eq('id', c.id));
    else ok(await sb.from('clienti').insert(riga));
    return DB.carica();
  },
  async eliminaCliente(id) {
    ok(await sb.from('clienti').delete().eq('id', id));
    return DB.carica();
  },
  /** nuovi = [{nome, tipo, b64}] da caricare; rimuovi = [id allegato] da staccare (le schede caricate qui vengono cancellate). */
  async salvaLezione(l, nuovi, rimuovi) {
    const c = S.clienti.find(x => x.id === l.cliente);
    if (!c) throw new Error('Scegli il cliente');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(l.d || '')) throw new Error('Data non valida');
    const id = l.id || nuovoId();
    const vecchia = S.lezioni.find(x => x.id === id);
    let allegati = (vecchia ? vecchia.allegati : []).slice();
    const via = allegati.filter(a => rimuovi.indexOf(a.id) >= 0 && a.dove === 'storage').map(a => a.id);
    allegati = allegati.filter(a => rimuovi.indexOf(a.id) < 0);
    for (let i = 0; i < nuovi.length; i++) {
      const f = nuovi[i], sicuro = (f.nome || 'scheda').replace(/[^\w.\-]+/g, '_').slice(-60);
      const path = UTENTE.id + '/' + id + '/' + Date.now() + '-' + i + '-' + sicuro;
      ok(await sb.storage.from('schede').upload(path, b64blob(f.b64, f.tipo), { contentType: f.tipo, upsert: false }));
      allegati.push({ id: path, nome: f.nome, tipo: f.tipo, dove: 'storage' });
    }
    const importo = l.importo !== undefined && l.importo !== '' && isFinite(Number(l.importo)) ? Number(l.importo) : c.tariffa;
    ok(await sb.from('lezioni').upsert({ id, d: l.d, ora: l.ora || '', cliente: l.cliente, importo, scheda: l.scheda || '', scheda_id: l.scheda_id || null, allegati, note: l.note || '' }));
    if (via.length) await sb.storage.from('schede').remove(via);
    return DB.carica();
  },
  async eliminaLezione(id) {
    const l = S.lezioni.find(x => x.id === id);
    ok(await sb.from('lezioni').delete().eq('id', id));
    const via = l ? l.allegati.filter(a => a.dove === 'storage').map(a => a.id) : [];
    if (via.length) await sb.storage.from('schede').remove(via);
    return DB.carica();
  },
  async salvaPagamento(p) {
    const imp = Number(p.importo);
    if (!isFinite(imp) || !imp) throw new Error('Importo non valido');
    ok(await sb.from('pagamenti').upsert({ id: p.id || nuovoId(), d: p.d, cliente: p.cliente, importo: imp, metodo: p.metodo || '', note: p.note || '' }));
    return DB.carica();
  },
  async eliminaPagamento(id) {
    ok(await sb.from('pagamenti').delete().eq('id', id));
    return DB.carica();
  },
  async salvaScheda(sc) {
    ok(await sb.from('schede').upsert({ id: sc.id, nome: sc.nome, cliente: sc.cliente || null, note: sc.note || '', blocchi: sc.blocchi, modificata: new Date().toISOString() }));
    return DB.carica();
  },
  async eliminaScheda(id) {
    ok(await sb.from('schede').delete().eq('id', id));
    return DB.carica();
  },
  /** e = {id?, base?, nome, sez, cat, descr}; file = foto nuova {tipo, b64}; via = vecchia foto da cancellare */
  async salvaEsercizio(e, file, via) {
    const id = e.id || nuovoId(), prima = (S.esercizi || []).find(x => x.id === id);
    let foto = prima ? prima.foto : null;
    if (file) {
      foto = UTENTE.id + '/esercizi/' + id + '-' + Date.now() + '.jpg';
      ok(await sb.storage.from('schede').upload(foto, b64blob(file.b64, file.tipo), { contentType: file.tipo }));
    } else if (via) foto = null;
    ok(await sb.from('esercizi_miei').upsert({ id, base: e.base || null, nome: e.nome, sez: e.sez, cat: e.cat, descr: e.descr || '', foto }));
    if (via && via !== foto) await sb.storage.from('schede').remove([via]);
    return DB.carica();
  },
  async eliminaEsercizio(id) {
    const e = (S.esercizi || []).find(x => x.id === id);
    ok(await sb.from('esercizi_miei').delete().eq('id', id));
    if (e && e.foto) await sb.storage.from('schede').remove([e.foto]);
    return DB.carica();
  },
  /** Copia i dati dalla vecchia app Google (le schede già caricate restano su Google Drive). Si può ripetere: non crea doppioni. */
  async importa(dati) {
    const cl = (dati.clienti || []).map(c => ({ id: String(c.id), nome: String(c.nome || '').trim() || 'Senza nome', tel: c.tel || '', tariffa: Number(c.tariffa) > 0 ? Number(c.tariffa) : 15,
      prec: Math.max(0, Math.round(Number(c.prec) || 0)), saldo_iniz: Number(c.saldoIniz) || 0, colore: c.colore || '#2a78d6', attivo: c.attivo !== false, note: c.note || '' }));
    const ids = new Set(cl.map(c => c.id));
    const le = (dati.lezioni || []).filter(l => ids.has(String(l.cliente)) && /^\d{4}-\d{2}-\d{2}$/.test(l.d)).map(l => ({ id: String(l.id), d: l.d, ora: l.ora || '', cliente: String(l.cliente),
      importo: Number(l.importo) || 0, scheda: l.scheda || '', note: l.note || '', ins: l.ins ? new Date(l.ins).toISOString() : new Date().toISOString(),
      allegati: (l.allegati || []).map(a => ({ id: a.id, nome: a.nome, tipo: a.tipo, dove: a.dove || 'drive' })) }));
    const pa = (dati.pagamenti || []).filter(p => ids.has(String(p.cliente)) && Number(p.importo)).map(p => ({ id: String(p.id), d: p.d, cliente: String(p.cliente),
      importo: Number(p.importo), metodo: p.metodo || '', note: p.note || '' }));
    if (cl.length) ok(await sb.from('clienti').upsert(cl));
    for (let i = 0; i < le.length; i += 500) ok(await sb.from('lezioni').upsert(le.slice(i, i + 500)));
    for (let i = 0; i < pa.length; i += 500) ok(await sb.from('pagamenti').upsert(pa.slice(i, i + 500)));
    return DB.carica();
  }
};

/** Le schede caricate nell'app sono private: si aprono con un link temporaneo firmato. */
async function firma(box) {
  if (!sb) return;
  const els = Array.from(box.querySelectorAll('[data-path]'));
  if (!els.length) return;
  const r = await sb.storage.from('schede').createSignedUrls(els.map(e => e.dataset.path), 3600);
  (r.data || []).forEach((x, i) => {
    if (!x.signedUrl) return;
    els[i].href = x.signedUrl;
    const im = els[i].querySelector('img[data-img]');
    if (im) im.src = x.signedUrl;
  });
}

  $('aGo').disabled = true;
  try {
    const qui = location.origin + location.pathname;
    if (modoAuth === 'accedi') {
      const r = await sb.auth.signInWithPassword({ email, password: pw }); if (r.error) throw r.error;
    } else if (modoAuth === 'crea') {
      const r = await sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: qui } }); if (r.error) throw r.error;
      if (!r.data.session) { modo('accedi'); $('aEmail').value = email; say('Fatto! Ti ho mandato un’email: apri il link per confermare, poi accedi qui.', 'ok'); }
    } else if (modoAuth === 'reset') {
      const r = await sb.auth.resetPasswordForEmail(email, { redirectTo: qui }); if (r.error) throw r.error;
      say('Se l’email è giusta ti arriva un link tra poco. Aprilo da questo dispositivo.', 'ok');
    } else if (modoAuth === 'nuova') {
      const r = await sb.auth.updateUser({ password: pw }); if (r.error) throw r.error;
      toast('Password cambiata ✓'); avvia(r.data.user);
    }
  } catch (err) { say(msgAuth(err)); }
  finally { $('aGo').disabled = false; }
};

function menuAccount() {
  apri('<h3>Account</h3><p class="hint" style="margin:-6px 0 14px">' + esc(UTENTE ? UTENTE.email : '') + '</p>' +
    '<button class="menu-row" id="mImp">⬇️ Importa dalla vecchia app Google</button>' +
    '<button class="menu-row" id="mPw">🔑 Cambia password</button>' +
    '<button class="menu-row" id="mEsci" style="color:var(--bad)">↩️ Esci</button>');
  $('mImp').onclick = formImporta;
  $('mPw').onclick = () => { chiudi(); mostraAuth('nuova'); };
  $('mEsci').onclick = async () => { await sb.auth.signOut(); chiudi(); S = { clienti: [], lezioni: [], pagamenti: [], tariffaDefault: 15 }; mostraAuth('accedi'); };
}
$('accBtn').onclick = menuAccount;

function formImporta() {
  apri('<h3>Importa dalla vecchia app</h3>' +
    '<ol style="padding-left:20px;margin:0 0 12px;font-size:14px;line-height:1.55">' +
    '<li>Apri la vecchia app Google di HomeFitness.</li><li>In fondo alla pagina tocca <b>“Trasferisci nella nuova app”</b>, poi <b>Copia</b>.</li>' +
    '<li>Torna qui, tieni premuto nel riquadro qui sotto e scegli <b>Incolla</b>.</li></ol>' +
    '<textarea class="incolla" id="impTxt" placeholder="Incolla qui i dati copiati…"></textarea>' +
    '<p class="hint">Puoi ripetere l’importazione: non crea doppioni. Le foto delle schede già caricate restano su Google Drive e si aprono da lì.</p>' +
    '<div class="actions"><button class="btn ghost" id="impNo">Più tardi</button><button class="btn" id="impGo">Importa</button></div>');
  $('impNo').onclick = () => { try { localStorage.setItem('hf-import-visto', '1'); } catch (e) {} chiudi(); };
  $('impGo').onclick = async () => {
    let dati;
    try { dati = JSON.parse($('impTxt').value.trim()); } catch (e) { return toast('Il testo incollato non è valido: ricopialo dalla vecchia app', true); }
    if (!dati || !Array.isArray(dati.clienti)) return toast('Il testo incollato non contiene i dati di HomeFitness', true);
    if (await run('importa', [dati], 'Importati ' + dati.clienti.length + ' clienti, ' + (dati.lezioni || []).length + ' lezioni, ' + (dati.pagamenti || []).length + ' pagamenti ✓')) {
      try { localStorage.setItem('hf-import-visto', '1'); } catch (e) {}
      chiudi();
    }
  };
}

async function avvia(user) {
  UTENTE = user;
  $('auth').classList.add('hidden');
  ['main', 'tabbar', 'accBtn'].forEach(id => $(id).classList.remove('hidden'));
  busy(true);
  try {
    S = await api('carica'); render();
    let visto = null; try { visto = localStorage.getItem('hf-import-visto'); } catch (e) {}
    if (!DEMO && !S.clienti.length && !visto) formImporta();
  } catch (e) { toast('Errore nel caricamento: ' + ((e && e.message) || e), true); }
  finally { busy(false); }
}

    if (g === 3 && i > -20) db.lezioni.push({ id: 'l' + (k++), d: iso(d), ora: '', cliente: 'c3', importo: 15, scheda: '', allegati: [], note: '', ins: k });
  }
  db.schede.push({ id: 'sA', nome: 'Forza A – gambe', cliente: 'c1', note: '', modificata: new Date().toISOString(), blocchi: {

  const out = () => JSON.parse(JSON.stringify(db));
  const up = (arr, o) => { const i = arr.findIndex(x => x.id === o.id); if (i >= 0) arr[i] = Object.assign(arr[i], o); else arr.push(o); };

    salvaEsercizio: (e, file, via) => { const id = e.id || nid(), prima = db.esercizi.find(x => x.id === id);

if ('serviceWorker' in navigator && !DEMO && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
(async function () {
  if (DEMO) return avvia({ email: 'demo' });
  let recupero = /type=recovery/.test(location.hash);
  sb.auth.onAuthStateChange((ev, sess) => {
    if (ev === 'PASSWORD_RECOVERY') { recupero = true; mostraAuth('nuova'); }
    else if (ev === 'SIGNED_IN' && sess && !recupero && (!UTENTE || UTENTE.id !== sess.user.id)) setTimeout(() => avvia(sess.user), 0);
  });
  const { data } = await sb.auth.getSession();
  if (recupero) return mostraAuth('nuova');
  if (data.session) avvia(data.session.user); else mostraAuth('accedi');
})();
